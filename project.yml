name: RemoteHandset
options:
  bundleIdPrefix: com.dltengwen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0
settings:
  base:
    DEVELOPMENT_TEAM: 232AW49Q9J
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
targets:
  RemoteHandset:
    type: application
    platform: iOS
    sources:
      - path: RemoteHandset
        excludes:
          - Resources/Info.plist
          - Resources/AppIcon.svg
          - Core/Audio/PushToTalkAudioCapture.swift
    resources:
      - path: RemoteHandset/Resources/Assets.xcassets
      - path: RemoteHandset/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dltengwen.remotehandset
        PRODUCT_NAME: RemoteHandset
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 33
        INFOPLIST_FILE: RemoteHandset/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ""
        DEAD_CODE_STRIPPING: true
        SWIFT_COMPILATION_MODE: wholemodule
    scheme:
      gatherCoverageData: false
      testTargets: []
